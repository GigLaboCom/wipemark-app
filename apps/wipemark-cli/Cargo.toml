[package]
name = "wipemark-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wipemark command line — the same pipeline, for scripts, pre-commit hooks and agents."

[[bin]]
name = "wipemark-cli"
path = "src/main.rs"

[dependencies]
# Named directly, and only under `llama-native`, for one thing: its
# `links` metadata reaches this package's build script only through a direct
# dependency, and build.rs puts llama.cpp's library directory on this
# binary's rpath. Nothing in src/ uses it.
wipemark-llama-sys = { workspace = true, optional = true }
wipemark-core.workspace = true
wipemark-i18n.workspace = true
wipemark-pipeline.workspace = true
# `rewrite` with no application running: the local engine (`LocalEngine`,
# under `local-llama`) and the refusals it can answer with. Never
# `FakeEngine` outside the tests — plausible text with no model behind it
# is a document filed as rewritten by a rewriter that never ran.
wipemark-engine.workspace = true
wipemark-models.workspace = true
tracing.workspace = true
# Same log file shape as the app, in the same directory, under a
# different stem. A hook that fails in CI leaves the same evidence a
# window would. See docs/architecture/logging.md.
wipemark-log.workspace = true
# A read-only open of `wipemark.db`: the `ui.language` the app saved
# (`configured_language`); `models.dir` and `models.rewrite` for `models`
# and `rewrite` (`models::Place`); and for `rewrite`, `engine.serves` and
# `engine.provider` (who would answer), the `prompts.*` template rows and
# `rewrite.pivot`. Never created, never written; the writer, and the rest
# of the settings model, are the app's.
wipemark-store.workspace = true
# The CLI reads a file the way a drop is read, and names its result the
# way the app does (`wipemark_intake::name::with_infix`).
wipemark-intake.workspace = true
# `inspect`, `clean` and `audit` on a PNG, JPEG or WebP: its metadata
# blocks, found and removed, with every pixel byte left as it was. The
# reports' JSON is the library's own writer, as Layer A's is core's.
wipemark-image.workspace = true
# Only to escape the one string — the cleaned text, the path written — a
# `--json` answer carries beside core's report, and for the tests to read
# that answer back.
serde_json.workspace = true
clap.workspace = true
# `models pull`: Ctrl-C cancels the download and keeps the `.part`; and
# `rewrite`: Ctrl-C cancels the job (or hangs up on the application, which
# cancels it there). See the workspace manifest for why this is a crate and
# not std.
ctrlc.workspace = true

[dev-dependencies]
# `tests/image.rs` borrows `wipemark-image`'s own fixture builders
# (`crates/wipemark-image/tests/support`, by `#[path]`) and the gate's
# decoders: the output's raster is decoded before and after a `clean` and
# compared. All four are already in the tree through gpui and
# `wipemark-image`'s own dev-dependencies — the lock gains edges, no
# package.
png = "0.18"
zune-jpeg = "0.5"
image-webp = "0.2"
sha2.workspace = true

[features]
default = []
# The local engine, forwarded through the pipeline: `local-llama` over a
# shim that refuses every load, `llama-native` with llama.cpp built in.
local-llama = ["wipemark-pipeline/local-llama", "wipemark-engine/local-llama"]
llama-native = ["local-llama", "wipemark-pipeline/llama-native", "dep:wipemark-llama-sys"]

[lints]
workspace = true
