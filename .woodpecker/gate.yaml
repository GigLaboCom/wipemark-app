# wipemark — FMT / CLIPPY / TEST gate.
#
# The one lane that must be green before anything merges. Runs the
# formatter, the linter, the test suite, and the two structural checks
# that nothing else can catch: the dependency direction rule and the
# feature wiring.
#
# BACKEND: docker, linux/arm64 — the same fleet the mnemoria lanes use.
# macOS-only work (the `metal` feature, codesign, notarisation) cannot
# run here; it needs the local-backend Mac agent and arrives with its own
# lane in epic E2 / E10. See `.woodpecker/ml-metal-test.yaml` in
# heretic-mnemoria for the shape that lane takes, and for why it must
# stay narrowly triggered.
#
# COST WARNING. `cargo clippy --workspace` compiles GPUI from source —
# the workspace contains a GPUI application, and there is no way to lint
# it without building its dependencies. That is tens of minutes cold.
# The persistent CARGO_HOME/target volumes below are therefore not an
# optimisation, they are what makes this lane usable at all. They need
# `trusted.volumes` on the repo, exactly as the mnemoria lanes do.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

labels:
  platform: linux/arm64

variables:
  - &rust_image rust:1.94-trixie
  - &ci_env
    CARGO_TERM_COLOR: always
    # Keeps the dependency cache without the bulky incremental/ dir.
    CARGO_INCREMENTAL: '0'
    CARGO_HOME: /cache/wipemark/cargo
    CARGO_TARGET_DIR: /cache/wipemark/target

steps:
  # ── 0. The submodule, and the pin that makes it usable ─────────────
  # gpui-component lists its own `gpui` dependency WITHOUT a rev, so a
  # plain checkout resolves it against whatever is on zed's main today —
  # a second, different `gpui` package in the same binary, which does
  # not link. The script rewrites those lines to our pinned rev. A
  # checkout that skips this step fails later with a type error deep
  # inside gpui-component, which reads like a compiler bug and is not.
  - name: submodule
    image: *rust_image
    environment: *ci_env
    commands:
      # sync first: a cached checkout keeps the submodule URL it was
      # cloned with, and the fork moved to GigLaboCom on 2026-10-03.
      - git submodule sync --recursive
      - git submodule update --init --recursive
      - scripts/pin-gpui-component.sh
      - git -C vendor/gpui-component log --oneline -1

  # ── 1. Structure. Runs first because it is instant and it catches the
  #       class of mistake that compiles perfectly well.
  - name: structure
    image: *rust_image
    environment: *ci_env
    commands:
      - scripts/check-dep-direction.sh

  # ── 2. Format. Nightly, because rustfmt.toml uses unstable options
  #       (imports_granularity, group_imports). The pinned stable
  #       toolchain from rust-toolchain.toml does everything else.
  - name: fmt
    image: *rust_image
    environment: *ci_env
    commands:
      - rustup toolchain install nightly --component rustfmt --profile minimal
      # Not `cargo fmt --all`: it reaches into vendor/gpui-component,
      # which is upstream's code formatted to upstream's rules and is
      # not ours to reformat. rustfmt still reads our rustfmt.toml.
      - rustup run nightly rustfmt --edition 2021 --check $(find crates apps -name '*.rs')

  # ── 3. System libraries GPUI needs on Linux. Same list as
  #       heretic-amuse-merge's CI, which is proven on Debian/Ubuntu.
  - name: deps
    image: *rust_image
    environment: *ci_env
    commands:
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        build-essential pkg-config
        libxkbcommon-dev libwayland-dev libxcb1-dev
        libvulkan1 mesa-vulkan-drivers
        libgtk-3-dev libayatana-appindicator3-dev

  - name: clippy
    image: *rust_image
    environment: *ci_env
    depends_on: [submodule, deps, fmt, structure]
    commands:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  - name: test
    image: *rust_image
    environment: *ci_env
    depends_on: [clippy]
    commands:
      - cargo test --workspace --locked

  # ── 4. Feature wiring. Not a matrix yet — `local-llama` gates no code
  #       until epic E2 lands `LlamaEngine`, so there is nothing to build
  #       twice. What this DOES prove is that the feature resolves
  #       through app → pipeline → engine, which is the part that breaks
  #       silently: a forwarded feature with a typo in the crate name
  #       fails only when someone finally enables it.
  #
  #       When E2 lands, this step becomes the real matrix:
  #         - linux/arm64: --features local-llama (vulkan)
  #         - .101 runner:  --features local-llama,cuda (sm_120)
  #         - Mac agent:    --features local-llama,metal (local backend)
  - name: features
    image: *rust_image
    environment: *ci_env
    depends_on: [clippy]
    commands:
      - cargo check --workspace --no-default-features --locked
      - cargo check --workspace --features local-llama --locked
