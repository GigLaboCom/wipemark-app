# NOTE: the lane that reports on pushes and pull requests today is the
# GitHub Actions workflow `.github/workflows/gate.yml` — the same gates,
# plus a native llama.cpp + Vulkan lane and a macOS lane (clippy, the
# tests, llama.cpp with Metal). This file is
# the self-hosted Woodpecker lane and is kept for that fleet; it has not
# reported a status on any commit yet.
#
# wipemark — FMT / CLIPPY / TEST gate.
#
# The one lane that must be green before anything merges. Runs the
# formatter, the linter, the test suite, and the two structural checks
# that nothing else can catch: the dependency direction rule and the
# feature wiring.
#
# BACKEND: docker, linux/arm64 — the same fleet the mnemoria lanes use.
# macOS-only work (the `metal` feature, codesign, notarisation) cannot
# run here; it needs the local-backend Mac agent and arrives with its own
# lane in epic E2 / E10. See `.woodpecker/ml-metal-test.yaml` in
# heretic-mnemoria for the shape that lane takes, and for why it must
# stay narrowly triggered.
#
# COST WARNING. `cargo clippy --workspace` compiles GPUI from source —
# the workspace contains a GPUI application, and there is no way to lint
# it without building its dependencies. That is tens of minutes cold.
# The persistent CARGO_HOME/target volumes below are therefore not an
# optimisation, they are what makes this lane usable at all. They need
# `trusted.volumes` on the repo, exactly as the mnemoria lanes do.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

labels:
  platform: linux/arm64

variables:
  - &rust_image rust:1.95-trixie
  - &ci_env
    CARGO_TERM_COLOR: always
    # Keeps the dependency cache without the bulky incremental/ dir.
    CARGO_INCREMENTAL: '0'
    CARGO_HOME: /cache/wipemark/cargo
    CARGO_TARGET_DIR: /cache/wipemark/target

steps:
  # ── 0. The submodule, and the one-GPUI check ─────────────────────────
  # gpui-component (upstream gpui-kit, branch `next`) takes GPUI from the
  # `gpui-pre` snapshots at an exact version, as the workspace does; the
  # check is that the two agree, the lock holds one of each snapshot
  # crate, all from crates.io and no zed git source, and the resolved
  # sources still carry the upstream X11 fixes the windows rely on
  # (#62081, #61789). It replaces the retired pin script.
  - name: submodule
    image: *rust_image
    environment: *ci_env
    commands:
      # sync first: a cached checkout keeps the submodule URL it was
      # cloned with, and the submodule moved to longbridge/gpui-kit on
      # 2026-10-07.
      - git submodule sync --recursive
      - git submodule update --init --recursive
      - git -C vendor/gpui-component log --oneline -1
      - scripts/check-gpui-pin.sh

  # ── 1. Structure. Runs first because it is instant and it catches the
  #       class of mistake that compiles perfectly well.
  - name: structure
    image: *rust_image
    environment: *ci_env
    commands:
      - scripts/check-dep-direction.sh

  # ── 2. Format. Nightly, because rustfmt.toml uses unstable options
  #       (imports_granularity, group_imports). The pinned stable
  #       toolchain from rust-toolchain.toml does everything else.
  - name: fmt
    image: *rust_image
    environment: *ci_env
    commands:
      - rustup toolchain install nightly --component rustfmt --profile minimal
      # Not `cargo fmt --all`: it reaches into vendor/gpui-component,
      # which is upstream's code formatted to upstream's rules and is
      # not ours to reformat. rustfmt still reads our rustfmt.toml.
      - rustup run nightly rustfmt --edition 2021 --check $(find crates apps -name '*.rs')

  # ── 3. System libraries GPUI needs on Linux. Same list as
  #       heretic-amuse-merge's CI, which is proven on Debian/Ubuntu.
  - name: deps
    image: *rust_image
    environment: *ci_env
    commands:
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        build-essential pkg-config
        libxkbcommon-dev libwayland-dev libxcb1-dev
        libvulkan1 mesa-vulkan-drivers
        libgtk-3-dev libayatana-appindicator3-dev

  - name: clippy
    image: *rust_image
    environment: *ci_env
    depends_on: [submodule, deps, fmt, structure]
    commands:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  - name: test
    image: *rust_image
    environment: *ci_env
    depends_on: [clippy]
    commands:
      - cargo test --workspace --locked
      # The local engine's tests over the shim (no C++ toolchain): the
      # workspace test does not enable `local-llama`, so without this line
      # its refusals are never run in CI.
      - cargo test -p wipemark-engine --features local-llama --locked
      # And the application's half: with `local-llama`, `duty::engine_for`
      # hands out a `LocalEngine` (`engine_for_never_hands_out_a_fake`),
      # which the default build only ever refuses. Over the same shim, so
      # no toolchain either.
      - cargo test -p wipemark-app --features local-llama --locked

  # ── 4. Feature wiring. `local-llama` compiles the local engine over a
  #       shim — no cmake, no libclang, which this image has neither of
  #       (D47) — so it proves the Rust surface builds and that the
  #       feature resolves through app → pipeline → engine, the part that
  #       breaks silently: a forwarded feature with a typo in the crate
  #       name fails only when someone finally enables it.
  #
  #       `llama-native` (cmake + bindgen + llama.cpp) has no lane yet
  #       (E2-1 §7, S2.6). When it does, it is a matrix of its own:
  #         - a CUDA host:  GGML_CUDA=ON --features llama-native (sm_120)
  #         - Mac agent:    --features llama-native (Metal is ggml's
  #                         default there)
  #       and each lane runs vendor/fetch.sh first.
  - name: features
    image: *rust_image
    environment: *ci_env
    depends_on: [clippy]
    commands:
      - cargo check --workspace --no-default-features --locked
      - cargo check --workspace --features local-llama --locked
