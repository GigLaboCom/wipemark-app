# wipemark — the gate on GitHub Actions.
#
# The lane that reports on pushes and pull requests today. It runs the
# same gates `.woodpecker/gate.yaml` lists (the self-hosted lane, which
# has never reported a status) and CLAUDE.md's "Gates" section states,
# with `--locked` everywhere: a `Cargo.lock` that moved under an edit is
# a red lane here and a green laptop.
#
#   gate    — the four gates (nightly rustfmt over crates/ and apps/ only,
#             clippy -D warnings, the workspace tests, the dependency
#             direction) and the CI-only feature lines (`--no-default-
#             features`, `local-llama` over the shim).
#   native  — llama.cpp at the pin, built with the Vulkan backend (the
#             backend a Linux release ships), then clippy and the
#             model-free tests of wipemark-llama and wipemark-engine under
#             `llama-native`. No GPU and no model on a hosted runner: the
#             `--ignored` live gate is not run here and still runs by hand
#             (docs/architecture/local-engine.md, "Running the native
#             gates"). What this lane proves is that the native build
#             compiles on a clean machine.
#   macos   — the platform the GUI targets first, linted and tested:
#             clippy -D warnings over the workspace (the first lint the
#             `cfg(target_os = "macos")` code gets — Linux never compiles
#             it), the workspace tests, the `local-llama` tests over the
#             shim, and llama.cpp at the pin built with Metal (ggml's
#             default on Apple) with clippy and the model-free tests over
#             it. The tray, the global shortcut, the pasteboard drop target,
#             the clipboard peek, the display watch and the AppKit window
#             move run nowhere else. No model on a hosted runner: the
#             `--ignored` live gate still runs by hand.
name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keeps the dependency cache without the bulky incremental/ dir.
  CARGO_INCREMENTAL: "0"
  # Debug info is most of a GPUI target directory and nothing a gate
  # reads; a hosted runner has ~14 GB free before it is cleared.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: gate (fmt, clippy, test, deps, features)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/microsoft/msedge \
            /usr/local/share/chromium /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # gpui-component lists its own `gpui` without a rev; without the pin
      # a second, different `gpui` lands in the binary and the failure
      # reads like a compiler bug. Must precede every cargo command.
      - name: Pin the gpui-component submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          scripts/pin-gpui-component.sh
          git -C vendor/gpui-component log --oneline -1

      - name: Dependency direction
        run: scripts/check-dep-direction.sh

      - name: Toolchains
        run: |
          # The pinned stable from rust-toolchain.toml, with its components.
          rustup toolchain install
          rustup show active-toolchain
          # Nightly for rustfmt only: rustfmt.toml uses unstable options.
          rustup toolchain install nightly --component rustfmt --profile minimal

      # Not `cargo fmt --all`: that reaches into vendor/gpui-component,
      # which is upstream's code formatted to upstream's rules.
      - name: rustfmt (nightly)
        run: rustup run nightly rustfmt --edition 2021 --check $(find crates apps -name '*.rs')

      # The system libraries GPUI needs on Linux: the woodpecker list,
      # plus what a clean Ubuntu runner turns out to lack.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          cache-on-failure: true

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: check --no-default-features
        run: cargo check --workspace --no-default-features --locked

      - name: check --features local-llama
        run: cargo check --workspace --features local-llama --locked

      # The local engine's refusals over the shim, and `engine_for` handing
      # out a `LocalEngine` — neither is run by the workspace test.
      - name: test wipemark-engine --features local-llama
        run: cargo test -p wipemark-engine --features local-llama --locked

      - name: test wipemark-app --features local-llama
        run: cargo test -p wipemark-app --features local-llama --locked

      - name: Disk left
        if: always()
        run: df -h /

  native:
    name: native (llama.cpp + Vulkan, model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GGML_VULKAN: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The workspace manifest names the submodule's crates, so cargo
      # needs it pinned even for `-p wipemark-llama`.
      - name: Pin the gpui-component submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          scripts/pin-gpui-component.sh

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Build tools and the Vulkan SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev \
            libvulkan-dev glslc spirv-headers libvulkan1 mesa-vulkan-drivers

      - name: Fetch llama.cpp at the pin
        run: crates/wipemark-llama-sys/vendor/fetch.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: true

      - name: clippy (llama-native)
        run: cargo clippy -p wipemark-llama -p wipemark-engine --features wipemark-engine/llama-native --all-targets --locked -- -D warnings

      - name: test (llama-native, model-free)
        run: cargo test -p wipemark-llama -p wipemark-engine --features wipemark-engine/llama-native --locked

  macos:
    name: macos (clippy, tests, llama-native with Metal)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin the gpui-component submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          scripts/pin-gpui-component.sh

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          brew list cmake > /dev/null 2>&1 || brew install cmake

      # What the runner is: a hosted Apple Silicon VM. Whether it exposes
      # a Metal device is printed here and again by the native runtime
      # test below, which names every ggml device it registered.
      - name: Machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.memsize
          system_profiler SPDisplaysDataType || true

      - name: Fetch llama.cpp at the pin
        run: crates/wipemark-llama-sys/vendor/fetch.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          cache-on-failure: true

      # The steps after this one run even when an earlier one failed
      # (`!cancelled()`), so one run reports every red line on this
      # platform rather than the first; the job is still red.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: test wipemark-engine --features local-llama
        if: ${{ !cancelled() }}
        run: cargo test -p wipemark-engine --features local-llama --locked --no-fail-fast

      - name: test wipemark-app --features local-llama
        if: ${{ !cancelled() }}
        run: cargo test -p wipemark-app --features local-llama --locked --no-fail-fast

      - name: clippy (llama-native, Metal)
        if: ${{ !cancelled() }}
        run: cargo clippy -p wipemark-llama -p wipemark-engine --features wipemark-engine/llama-native --all-targets --locked -- -D warnings

      - name: test (llama-native, Metal, model-free)
        if: ${{ !cancelled() }}
        run: cargo test -p wipemark-llama -p wipemark-engine --features wipemark-engine/llama-native --locked --no-fail-fast

      # The devices ggml registered on this runner, printed: whether the
      # Metal backend found a GPU here is a fact about the runner, and
      # the test above passes on CPU alone.
      - name: ggml devices
        if: ${{ !cancelled() }}
        run: cargo test -p wipemark-llama --features native --locked --test native the_runtime_reports_at_least_the_cpu_backend -- --nocapture

      - name: Disk left
        if: always()
        run: df -h /
