# wipemark — test coverage on GitHub Actions.
#
# Why: the owner, 2026-10-06 — test coverage is the measure of what the
# tests reach, in place of the mutation tables that took ~13 hours a
# re-run (Watchword `wipemark-mutations-not-needed-2026-10-06`). Asked for
# as a mode of its own, on `main` only, the way the industry usually runs
# it: not a gate, not on every push or pull request.
#
# When (D808, the owner, 2026-10-17): once a week, Monday 02:17 UTC, on
# `main`, and by hand (`gh workflow run coverage.yml --ref <branch>`, or
# the Actions tab). Not on a push to `main`: a merge there comes just
# before a release, and a report that gates nothing has no business in the
# release's way — whether the tests pass is the gate's question, on every
# push and pull request. A scheduled run whose `main` is the commit the
# last successful report already measured stops after one small job, with
# a notice; a manual run always measures. A manual run needs this file on
# the default branch first; that is how GitHub finds a `workflow_dispatch`
# workflow. GitHub pauses a schedule after 60 days with no activity in the
# repository; the Actions tab turns it back on.
#
# What: the workspace tests (`cargo test --workspace`'s set, less the
# tests heavy under coverage, below) once, under LLVM's source-based
# coverage via cargo-llvm-cov, with the vendored gpui-component left out of
# the figures. No threshold and no failure on a low figure: it reports. No
# external service and no token: the figures stay in the run.
#
# What it leaves out, and why (D805–D807, the owner, 2026-10-17): the
# first run on `main`, 38977019032, was cancelled at the 300-minute limit
# two hours into `wipemark-pixels`' false-positive suite; under the
# instrumentation the visible-mark search runs 30 to 70 times slower than
# in the gate. Two tiers, each by a measured rule:
#   * the slow tier — every test past a minute in an ordinary gate run
#     (gate run 38977019041), behind each crate's `slow-tests` feature —
#     is never run here nor in any CI lane. It is local only:
#     `scripts/test-slow.sh`, by hand, before pushing a change to the
#     pixels, the picture crate or the CLI's picture path (CLAUDE.md,
#     "Gates");
#   * heavy under coverage — every other test past a minute in run
#     38977019032 (72, the application's unit tests among them) carries
#     `#[cfg_attr(coverage, ignore = …)]`. cargo-llvm-cov builds with
#     `--cfg coverage` unless given `--no-cfg-coverage`, so they are
#     skipped here and nowhere else: every gate runs them.
# The lines only those tests reach read as not covered. What is left was
# estimated at 25 to 32 minutes of tests (D807); most of it is
# `wipemark-pixels`' `interval.rs`, `v2_rows.rs`, `verify.rs` and
# `outline.rs`, which the first run never reached. A test joins or leaves
# a tier only by a run's log: `gh run view <id> --log`, then
# `scripts/test-tiers.py flagged`.
#
# Output: the per-file summary in the run's page (the job summary); the
# artifact `coverage` holding `lcov.info` (for an editor's gutter or any
# lcov tool) and `html/` (open `html/index.html`, a line-by-line view).
# A line counted as covered was executed by some test — not that a test
# asserted on it; CLAUDE.md's "Tests must be able to fail" stays the rule
# for that.
name: coverage

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  # A week with nothing merged measures nothing: the schedule's run asks
  # which commit the last successful report was made on, and stops when
  # `main` has not moved since. By hand it always goes on.
  changed:
    name: anything new since the last report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.last.outputs.measure }}
    steps:
      - name: The last report's commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh run list -R "$GITHUB_REPOSITORY" --workflow coverage.yml --branch main \
            --status success -L 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Coverage not measured::main is still at ${GITHUB_SHA:0:7}, which the last report already measured."
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
            echo "main is at ${GITHUB_SHA:0:7}; the last report measured ${last:-nothing yet}."
          fi

  coverage:
    name: coverage (workspace tests, report only)
    needs: changed
    if: needs.changed.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    # A hang's limit, not the run's length: D807 puts the tests at 25 to 32
    # minutes and the build at about five.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/microsoft/msedge \
            /usr/local/share/chromium /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # As in gate.yml: must precede every cargo command. `sync` first,
      # because a cached checkout keeps the URL it was cloned with and the
      # submodule moved to longbridge/gpui-kit on 2026-10-07. Nothing pins
      # any more: GPUI is gpui-pre from crates.io (dev/architecture/gpui-pin.md).
      - name: Submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-on-failure: true

      - name: Tests under coverage
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Reports
        run: |
          ignore='vendor/'
          mkdir -p coverage
          cargo llvm-cov report --ignore-filename-regex "$ignore" --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex "$ignore" --html --output-dir coverage
          {
            echo '## Coverage — workspace tests'
            echo
            echo 'Lines executed by a test; not a gate. Line-by-line: the `coverage` artifact, `html/index.html`.'
            echo
            echo '```'
            cargo llvm-cov report --ignore-filename-regex "$ignore" --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30

      - name: Disk left
        if: always()
        run: df -h /
