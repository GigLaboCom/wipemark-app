[package]
name = "wipemark-llama-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "llama.cpp at a pinned commit, prebuilt or built from source, and its bindings, only under `native` (pin in PIN.md)."
build = "build.rs"
# Gives dependent build scripts `DEP_WIPEMARK_LLAMA_BACKENDS_DIR` — where
# the ggml backend libraries of a native build landed.
links = "wipemark_llama"

[features]
# DEFAULT = no native compile. The crate is an empty shim: no cmake, no
# libclang, no fetched vendor tree, so `cargo check --features
# local-llama` runs on a CI image with none of them (D47).
default = []
# The real build: llama.cpp at the pin (src/pin.rs), linked as shared
# libraries. By default the prebuilt release of GigLaboCom/llama-cpp-prebuilt
# for the target (downloaded once, sha256-checked, unpacked), or the
# unpacked archive WIPEMARK_LLAMA_PREBUILT names; with WIPEMARK_LLAMA_SOURCE=1,
# or on a target nobody publishes, cmake builds one shared ggml and
# llama.cpp against it from vendor/llama.cpp (fetched by vendor/fetch.sh)
# and bindgen emits the bindings — cmake, a C++ compiler and libclang.
# The switch is an environment variable rather than a feature (E2-5 I1).
# Either way a C++ compiler builds the staging shim, shim/ext.cpp (D480).
native = ["dep:bindgen", "dep:cmake", "dep:sha2", "dep:flate2", "dep:tar", "dep:cc"]

# No runtime dependencies: this is a -sys crate. Every call site is in
# wipemark-llama's `ffi` module.

[build-dependencies]
# Optional and gated by `native`, so the default build graph compiles
# none of them.
bindgen = { workspace = true, optional = true }
cmake = { workspace = true, optional = true }
# The prebuilt archive: its sha256, then its gzip'd tar. The download is a
# `curl` subprocess, not an HTTP crate (E2-5 I3).
sha2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
# The staging shim, shim/ext.cpp: the `src/llama-ext.h` calls a DFlash2
# draft needs, wrapped `extern "C"` and compiled against the linked
# headers (E2-dflash2 F1, D480).
cc = { workspace = true, optional = true }

[lints]
workspace = true
