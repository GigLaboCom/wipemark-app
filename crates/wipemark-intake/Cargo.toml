[package]
name = "wipemark-intake"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wipemark — what was handed to the application, and what it turns out to be"

# NO [dependencies] SECTION, and that is the point of the crate. See the
# module docs: `infer`, `tree_magic_mini` and `mime_guess` all exist and
# all of them are bigger tables than this one. What none of them does is
# the part that is actually hard here — deciding what to believe when
# the bytes and the name disagree — and a table this crate cannot see
# into is a table whose answers it cannot explain in a report.

# The one exception, on Windows alone: whether two names are one file
# (`inplace::same_file`, what keeps a result from being written over its
# source) is the volume's serial number and the file's index on it, which
# `std` reads but does not yet hand out, and this crate forbids `unsafe`.
# `winapi-util` is the safe call, already in Cargo.lock (`same-file`'s).
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[lints]
workspace = true
