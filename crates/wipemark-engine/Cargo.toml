[package]
name = "wipemark-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "RewriteEngine trait and its implementations: Ollama and OpenAI-compatible over HTTP, llama.cpp behind a feature, and the deterministic FakeEngine."

[features]
default = []
# The local engine's Rust surface over a shim: compiles with no C++
# toolchain, refuses every load with "not built". The CI lane builds this.
# The engine is `LocalEngine` (src/local.rs) over crates/wipemark-llama
# (D45, docs/architecture/local-engine.md).
local-llama = ["dep:wipemark-llama"]
# The real llama.cpp build (cmake + bindgen + a C++ compiler). Implies
# local-llama. See crates/wipemark-llama-sys/PIN.md.
llama-native = ["local-llama", "wipemark-llama/native"]

[dependencies]
wipemark-core.workspace = true
async-trait.workspace = true
flume.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
wipemark-llama = { workspace = true, optional = true }
# The key an HTTP engine sends, held as a `Secret` from the credential
# store to the one header that carries it (D57). A `String` in an engine
# struct is one `{:?}` away from a log line.
wipemark-secret.workspace = true
# The HTTP engines (src/http/, D58): the blocking client the downloader
# already uses, on one thread per request, bridged to the trait with
# `flume` — no second async runtime beside GPUI's. Always compiled: the
# endpoint needs no C++ toolchain.
ureq.workspace = true
# The two wire formats' bodies and every streamed payload.
serde_json.workspace = true
# Log lines from the local engine's worker: lengths and timings, never a
# prompt or a completion.
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
